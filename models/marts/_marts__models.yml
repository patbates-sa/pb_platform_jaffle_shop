version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension. One record per customer, enriched with order history
      and lifetime value. Customers with no orders are retained, with zeroed
      counts and null order dates.
    columns:
      - name: customer_id
        description: Primary key for customers.
        data_tests:
          - unique
          - not_null
      - name: first_name
        description: Customer's first name.
      - name: last_name
        description: Customer's last initial.
      - name: first_order_date
        description: Date of the customer's first order. Null if they have never ordered.
      - name: most_recent_order_date
        description: Date of the customer's most recent order. Null if they have never ordered.
      - name: number_of_orders
        description: Count of orders placed by the customer. Zero if they have never ordered.
        data_tests:
          - not_null
      - name: lifetime_value
        description: Sum of all payments across the customer's orders, in dollars.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Order fact table. One record per order, with payment amounts split by
      payment method and zeroed when no payments exist.
    columns:
      - name: order_id
        description: Primary key for orders.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: status
        description: Current fulfillment status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - placed
                  - shipped
                  - completed
                  - return_pending
                  - returned
      - name: credit_card_amount
        description: Total credit card payments for the order, in dollars.
        data_tests:
          - not_null
      - name: coupon_amount
        description: Total coupon payments for the order, in dollars.
        data_tests:
          - not_null
      - name: bank_transfer_amount
        description: Total bank transfer payments for the order, in dollars.
        data_tests:
          - not_null
      - name: gift_card_amount
        description: Total gift card payments for the order, in dollars.
        data_tests:
          - not_null
      - name: amount
        description: Total payments for the order across all payment methods, in dollars.
        data_tests:
          - not_null
