version: 2

sources:
  - name: stripe
    description: Payment records synced from the Stripe API.
    database: pb_raw
    schema: stripe

    config:
      loaded_at_field: _etl_loaded_at
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}

    tables:
      - name: payments
        description: >
          One record per payment attempt. An order may have more than one
          payment, so this table is at a finer grain than orders.
        columns:
          - name: id
            description: Primary key of the payments table.
            data_tests:
              - unique
              - not_null
          - name: order_id
            description: Foreign key to jaffle_shop.orders.id.
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('jaffle_shop', 'orders')
                    field: id
          - name: payment_method
            description: Method used to make the payment.
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values:
                      - credit_card
                      - coupon
                      - bank_transfer
                      - gift_card
          - name: amount
            description: >
              Payment amount in CENTS, as Stripe reports it. Converted to
              dollars in stg_stripe__payments.
            data_tests:
              - not_null
